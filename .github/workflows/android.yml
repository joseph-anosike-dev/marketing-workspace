name: Android build

# Builds a signed Re-Search APK on every push to main and publishes it as the
# "latest" pre-release, so it can be downloaded and installed on a phone.
# One-time setup (signing key and secrets): docs/ANDROID.md

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write # needed to publish the release

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - name: Run tests
        run: npm test

      # Known problems are listed in the plan (VI, Hardening). Informational for now.
      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true

      - name: Build web app and sync to Android
        run: npm run android:sync

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing. Follow docs/ANDROID.md, step 1."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # Android only installs an update if this number goes up.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Re-Search.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Re-Search-apk
          path: Re-Search.apk

      - name: Publish as the latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Re-Search.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Build ${{ github.run_number }} from commit ${GITHUB_SHA::7}. Install Re-Search.apk on an Android phone."
